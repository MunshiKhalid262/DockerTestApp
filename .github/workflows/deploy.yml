      #     sudo rm -rf node_modules
      #     sudo mkdir -p node_modules
      #     sudo chown -R $(whoami) node_modules
      #     npm ci

      # - name: Run React tests
      #   working-directory: frontend
      #   run: npm run test

      - name: Tear down services
        run: docker compose down
